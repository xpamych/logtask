name: Проверки

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl jq file ca-certificates \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Зависимости npm
        run: npm ci

      - name: Тесты frontend
        run: node --conditions=browser --test src/lib/graph/*.test.ts src/components/graph/*.test.ts src/lib/*.test.ts

      - name: Сборка frontend
        run: npm run build

      - name: Аудит production-зависимостей
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Форматирование Rust
        run: cargo fmt --check

      - name: Статический анализ Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты Rust
        run: cargo test --workspace
