<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logtask Graph Benchmark</title><link rel="stylesheet" href="/styles/global.css"><style>html,body,#app{height:100%;margin:0}#perf{position:fixed;z-index:1000;top:8px;right:8px;background:#222;padding:8px}</style></head><body class="theme-dark"><div id="perf">Ожидание…</div><div id="app"></div><script>document.body.className=new URLSearchParams(location.search).get("theme")==="light"?"theme-light":"theme-dark";window.__TAURI_INTERNALS__={invoke:async(cmd)=>{if(cmd==="visual_graph_layout_get")return[];if(cmd==="visual_graph_snapshot"){const nodes=Array.from({length:10000},(_,i)=>({id:`page:P${i}`,title:`P${i}`,kind:"page",path:`pages/P${i}.md`,tags:[],degree:2,assetPath:null,exists:true}));const edges=[];for(let i=0;i<10000;i++){for(const step of [1,2])edges.push({id:`page:P${i}->page:P${(i+step)%10000}`,source:`page:P${i}`,target:`page:P${(i+step)%10000}`,weight:1})}for(let i=0;i<5000;i++)edges.push({id:`page:P${i}->page:P${(i+3)%10000}`,source:`page:P${i}`,target:`page:P${(i+3)%10000}`,weight:1});return{revision:1,nodes,edges}}throw new Error(cmd)}};const frameTimes=[];let previousFrame=0;function sampleFrame(now){if(previousFrame){frameTimes.push(now-previousFrame);if(frameTimes.length>180)frameTimes.shift()}previousFrame=now;requestAnimationFrame(sampleFrame)}requestAnimationFrame(sampleFrame);setInterval(()=>{const mark=performance.getEntriesByName("logtask:graph-interactive").at(-1);const sorted=[...frameTimes].sort((a,b)=>a-b);const p95=sorted.length?sorted[Math.floor(sorted.length*.95)]:0;if(mark)document.getElementById("perf").textContent=`Интерактивно: ${Math.round(mark.startTime)} мс; p95: ${p95.toFixed(1)} мс; ${document.querySelector(".graph-stats")?.textContent??""}`},100);</script><script type="module" src="/bench/visual-graph.ts"></script></body></html>
